<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Gustavo Jun</title>
    <meta
      name="description"
      content="Get in touch with Gustavo Jun Moritani."
    />
    <link rel="icon" href="img/Brand/Carinha.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/standard.css?v=3" />
    <link rel="stylesheet" href="styles/header.css?v=4" />
    <link rel="stylesheet" href="styles/contato.css?v=3" />
    <script defer src="script/script.js?v=3"></script>
    <script defer src="script/contato.js?v=3"></script>
    <script defer src="script/header.js?v=3"></script>
  </head>
  <body>
    <header>
      <p id="logo-header">
        <a class="logo-link transition-link" href="index.html">
          <img
            width="50"
            id="img-header"
            src="img/Brand/Carinha.svg"
            alt=""
          />GUSTAVO JUN</a
        >
      </p>
      <div id="navBar">
        <a class="transition-link" id="projects" href="projects.html"
          >PROJECTS</a
        >
        <a class="transition-link" id="contact" href="contato.html">CONTACT</a>
        <a
          id="resume"
          href="https://drive.google.com/file/d/1i4hoCdiApISO0dPAnDTQgt3JNQEbulOr/view"
          target="_blank"
          >RESUME</a
        >
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" class="lang-btn" data-lang="english">EN</button>
          <span class="lang-sep" aria-hidden="true">|</span>
          <button type="button" class="lang-btn" data-lang="portuguese">
            PT
          </button>
        </div>
      </div>
    </header>
    <div id="content" class="fade-container">
      <div id="containerContact" class="main">
        <form
          id="form-contact"
          action="https://api.web3forms.com/submit"
          method="POST"
          onsubmit="handleFormSubmit(event)"
        >
          <h1 id="title">GET IN TOUCH</h1>
          <input
            type="hidden"
            name="access_key"
            value="24d83ff5-67ad-4a9a-b206-6ee7dd2108c5"
          />
          <div class="field">
            <label class="field-label" for="name" id="label-name">Name</label>
            <input
              id="name"
              type="text"
              name="name"
              placeholder="Name"
              class="contact-inputs"
              autocomplete="name"
              required
            />
          </div>
          <div class="field">
            <label class="field-label" for="email" id="label-email">Email</label>
            <input
              id="email"
              type="email"
              name="email"
              placeholder="Email"
              class="contact-inputs"
              autocomplete="email"
              required
            />
          </div>
          <div class="field">
            <label class="field-label" for="message" id="label-message"
              >How can I help you?</label
            >
            <textarea
              id="message"
              name="message"
              placeholder="How can I help you?"
              class="contact-inputs"
              required
            ></textarea>
          </div>
          <button id="btSubmit" class="button" type="submit">SEND</button>
        </form>
        <div class="sendEmail">
          <p id="msgInfo">or send an email to</p>
          <a id="email-link" href="mailto:gustavojunmoritani@gmail.com"
            >gustavojunmoritani@gmail.com</a
          >
        </div>
      </div>

      <div id="background-overlay" class="hidden"></div>
      <div class="popup" id="popup">
        <img src="img/tick.png" alt="" />
        <h2 id="msgThankYou">Thank you!</h2>
        <p id="msgRespond">I’ll get back to you soon.</p>
        <button type="button" onclick="closePopup()">OK</button>
      </div>
    </div>
  </body>
</html>
